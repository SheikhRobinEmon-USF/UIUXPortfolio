name: Portfolio verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: source
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:static
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: source/test-results/
